version: '3.8'

services:
  # ----------------------------------------------------
  # 1. PostgreSQL Database
  # ----------------------------------------------------
  postgres:
    image: postgres:15-alpine
    container_name: cognitrack_postgres
    restart: always
    environment:
      POSTGRES_DB: cognitrack
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: Manohar
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d cognitrack"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ----------------------------------------------------
  # 2. Redis Cache & Live Telemetry Pub/Sub
  # ----------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: cognitrack_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data

  # ----------------------------------------------------
  # 3. CogniTrack FastAPI Backend Service
  # ----------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cognitrack_backend
    restart: always
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: cognitrack
      DB_USER: postgres
      DB_PASSWORD: Manohar
      REDIS_URL: redis://redis:6379/0
      USE_IN_MEMORY_REDIS_FALLBACK: "false"
      SECRET_KEY: cognitrack_production_secret_key_2026_x89q
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  # ----------------------------------------------------
  # 4. Admin Web Dashboard (Nginx Static Frontend)
  # ----------------------------------------------------
  admin:
    build:
      context: ./admin
      dockerfile: Dockerfile
    container_name: cognitrack_admin
    restart: always
    ports:
      - "5173:80"
    depends_on:
      - backend

  # ----------------------------------------------------
  # 5. Mobile Web Application (Nginx PWA Frontend)
  # ----------------------------------------------------
  mobile:
    build:
      context: ./mobile
      dockerfile: Dockerfile
    container_name: cognitrack_mobile
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  pgdata:
  redisdata:
