<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>CogniTrack — Marketing Executive & Field Telemetry</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        -webkit-tap-highlight-color: transparent;
        scrollbar-width: none !important;
        -ms-overflow-style: none !important;
      }
      *::-webkit-scrollbar {
        display: none !important;
        width: 0px !important;
        height: 0px !important;
      }
      body {
        font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
        background-color: #EEF2F6;
        background-image: radial-gradient(at 50% 0%, rgba(79, 70, 229, 0.08) 0px, transparent 65%);
        color: #0F172A;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        width: 100vw;
        overflow: hidden;
      }
      #root {
        width: 100%;
        max-width: 420px;
        height: 94vh;
        max-height: 880px;
        background: #F8FAFC;
        box-shadow: 0 25px 50px -12px rgba(15, 23, 42, 0.15), 0 0 0 8px #FFFFFF, 0 0 0 10px #E2E8F0;
        border-radius: 40px;
        overflow: hidden;
        position: relative;
        display: flex;
        flex-direction: column;
      }
      @media (max-width: 440px) {
        body {
          background-color: #F8FAFC;
        }
        #root {
          max-width: 100%;
          height: 100vh;
          max-height: 100vh;
          border-radius: 0;
          box-shadow: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
